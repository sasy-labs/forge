[project]
name = "forge-evaluation"
version = "0.1.0"
description = "Experiments accompanying the FORGE paper"
requires-python = ">=3.11,<3.12"
dependencies = [
  "sasy[otel]", "malade", "information-flow", "forge-tau2",
  "policy-translation", "matplotlib>=3.8", "seaborn>=0.13", "pandas>=2.2",
  "numpy>=1.26", "python-dotenv>=1.0", "rich>=13", "jsonschema>=4.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "sasy/sdk/python", "packages/policy-translation", "experiments/malade",
  "experiments/information-flow", "experiments/tau2-bench", "experiments/tau2",
]

[tool.uv.sources]
sasy = { workspace = true }
malade = { workspace = true }
information-flow = { workspace = true }
tau2 = { workspace = true }
forge-tau2 = { workspace = true }
policy-translation = { workspace = true }
