<svg xmlns="http://www.w3.org/2000/svg" width="1163" height="595" viewBox="0 0 1163 595" role="img" aria-labelledby="title desc">
  <title id="title">FORGE system architecture</title>
  <desc id="desc">FORGE instrumentation records messages and dependencies, checks proposed actions against developer policies and their relevant history, and dispatches allowed calls. Denied calls do not execute.</desc>
  <defs>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7655df"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#168b68"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#586e8c"/></marker>
    <g id="document" fill="none" stroke="#142348" stroke-width="3" stroke-linejoin="round"><path d="M0 0H28L40 12V54H0Z M28 0V12H40 M9 24H31 M9 34H31 M9 44H31"/></g>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#142348} .heading{font-size:22px;font-weight:700} .label{font-size:20px;font-weight:700} .body{font-size:16px;fill:#536987} .arrow-label{font-size:17px} .arrow{fill:none;stroke-width:2.4}</style>
  <rect width="1163" height="595" fill="white"/>
  <rect x="10" y="25" width="1143" height="236" rx="10" fill="#f4f8ff" stroke="#acc9f2" stroke-width="1.3"/>
  <text class="heading" x="34" y="62">YOUR APPLICATION</text>
  <rect x="34" y="77" width="230" height="114" rx="10" fill="#eaf2ff" stroke="#5a92ff" stroke-width="1.4"/>
  <g transform="translate(52 115)" fill="none" stroke="#142348" stroke-width="3.4" stroke-linejoin="round"><rect width="50" height="42" rx="12"/><path d="M25 0V-11 M0 15H-5V30H0 M50 15H55V30H50 M17 30H33"/><g fill="#142348" stroke="none"><circle cx="25" cy="-13" r="4"/><circle cx="15" cy="20" r="3"/><circle cx="35" cy="20" r="3"/></g></g>
  <text class="heading" x="122" y="130">Agent</text><text class="body" x="122" y="157">Model + workflow</text>
  <rect x="420" y="77" width="324" height="114" rx="10" fill="#f0eafd" stroke="#7350ff" stroke-width="1.4"/>
  <g transform="translate(447 116)" fill="none" stroke="#142348" stroke-width="3.4" stroke-linecap="round"><circle r="3"/><circle cy="16" r="3"/><circle cy="32" r="3"/><path d="M14 0H36 M14 16H36 M14 32H36"/></g>
  <text class="label" x="504" y="118">FORGE instrumentation</text><text class="body" x="504" y="146">Record inputs, check actions,</text><text class="body" x="504" y="166">and dispatch</text>
  <rect x="887" y="77" width="248" height="114" rx="10" fill="#e9f5ef" stroke="#6cb994" stroke-width="1.4"/>
  <g transform="translate(928 135)" fill="none" stroke="#142348" stroke-width="3"><circle r="23"/><circle r="8"/><path d="M0-31V-23 M0 23V31 M-31 0H-23 M23 0H31 M-22-22L-16-16 M16 16L22 22 M-22 22L-16 16 M16-16L22-22"/></g>
  <text class="label" x="966" y="129">Tools &amp; services</text><text class="body" x="966" y="155">Files, APIs, services</text>
  <path class="arrow" d="M264 111H420" stroke="#7655df" marker-end="url(#purple)"/><text class="arrow-label" x="279" y="100">Proposed action</text>
  <path class="arrow" d="M420 158H264" stroke="#586e8c" marker-end="url(#gray)"/><text class="arrow-label" x="300" y="182">Result or</text><text class="arrow-label" x="286" y="203">denial reason</text>
  <path class="arrow" d="M744 111H887" stroke="#168b68" marker-end="url(#green)"/><text class="arrow-label" x="771" y="100">Allowed call</text>
  <path class="arrow" d="M887 158H744" stroke="#586e8c" marker-end="url(#gray)"/><text class="arrow-label" x="783" y="187">Tool result</text>
  <circle cx="47" cy="230" r="12" fill="#c92e46"/><path d="M43 226L51 234 M51 226L43 234" stroke="white" stroke-width="3"/><text x="73" y="236" font-size="18" style="fill:#c92e46">Denied calls do not execute.</text>
  <rect x="10" y="373" width="786" height="206" rx="10" fill="#f7f4fe" stroke="#c8baf2" stroke-width="1.3"/>
  <text class="heading" x="34" y="409">FORGE ENGINE</text>
  <rect x="34" y="421" width="311" height="131" rx="10" fill="#f0eafd" stroke="#7655df" stroke-width="1.4"/>
  <g transform="translate(59 491)" stroke="#142348" stroke-width="2" fill="#aa91ef"><path d="M0 0L37-20L73 0 M0 0L37 25L73 0" fill="none"/><circle r="10"/><circle cx="37" cy="-20" r="10"/><circle cx="73" r="10"/><circle cx="37" cy="25" r="10"/></g>
  <text class="label" x="154" y="481">Dependency graph</text><text class="body" x="154" y="508">Messages and their inputs</text>
  <rect x="491" y="421" width="276" height="131" rx="10" fill="#f0eafd" stroke="#7350ff" stroke-width="1.4"/>
  <use href="#document" x="521" y="463"/>
  <text class="heading" x="586" y="470">Policy engine</text><text class="body" x="586" y="500">Evaluate action +</text><text class="body" x="586" y="521">recorded history</text>
  <rect x="887" y="421" width="266" height="131" rx="10" fill="#e9f5ef" stroke="#6cb994" stroke-width="1.4"/>
  <use href="#document" x="920" y="456"/>
  <text class="label" x="969" y="479">Developer policies</text><text class="body" x="969" y="507">Formal rules in policy.dl</text>
  <path class="arrow" d="M494 191V315H248V420" stroke="#7655df" marker-end="url(#purple)"/><text class="arrow-label" x="301" y="283">Record messages +</text><text class="arrow-label" x="325" y="304">dependencies</text>
  <path class="arrow" d="M603 191V420" stroke="#7350ff" marker-end="url(#purple)"/><text class="arrow-label" x="537" y="321">Check</text><text class="arrow-label" x="539" y="341">action</text>
  <path class="arrow" d="M660 421V192" stroke="#168b68" marker-end="url(#green)"/><text class="arrow-label" x="673" y="324">Allow / deny</text>
  <path class="arrow" d="M345 488H491" stroke="#7655df" marker-end="url(#purple)"/><text class="arrow-label" x="357" y="476">Relevant history</text>
  <path class="arrow" d="M887 488H767" stroke="#7655df" marker-end="url(#purple)"/><text class="arrow-label" x="804" y="476">Rules</text>
</svg>
