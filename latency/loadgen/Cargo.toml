[package]
name = "sasy-loadgen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Authorization replay client for the FORGE evaluation"
publish = false

[[bin]]
name = "sasy-loadgen"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive", "env"] }
rustls = { version = "=0.23.43", features = ["aws-lc-rs"] }
sasy-auth = { path = "../../sasy/crates/sasy-auth" }
sasy-common = { path = "../../sasy/crates/sasy-common" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full", "sync", "time", "rt-multi-thread", "macros"] }
tonic = { version = "=0.12.3", features = ["tls", "tls-roots"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
