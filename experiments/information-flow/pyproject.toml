[project]
name = "information-flow"
version = "0.0.1"
description = "Information flow control examples demonstrating prompt injection defense (MLS/Bell-LaPadula and Toxic Flow)"
authors = [{name = "Nils Palumbo"}]
license = {text = ""}
requires-python = ">=3.11,<3.12"
dependencies = [
    "langroid>=0.67.1",
    "sasy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
sasy = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["information_flow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
