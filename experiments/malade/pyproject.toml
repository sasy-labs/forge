[project]
name = "malade"
version = "0.0.1"
description = ""
authors = [{name = "Nils Palumbo"}]
readme = "README.md"
license = {text = ""}
requires-python = ">=3.11,<3.12"
dependencies = [
    # >=0.67.1: <=0.67.0 lets a model-supplied `_handler` redirect tool dispatch
    # past the tool check. Newer langroid also supports openai>=2 (needed by
    # the litellm range tau2 v1.0.1 requires).
    "langroid[hf-embeddings,litellm]>=0.67.1",
    # langroid (through 0.68.1) still reads CollectionInfo.vectors_count in
    # QdrantDB.create_collection; qdrant-client 1.16+ removed that field.
    "qdrant-client>=1.8.0,<1.16",
    "duckdb>=0.10.0",
    "pandas>=2.2.1",
    "nest_asyncio>=1.6.0",
    "matplotlib>=3.8.3",
    "altair[all]>=5.3.0",
    "anthropic[vertex]>=0.33.0",
    "boto3>=1.34.89",
    "transformers>=4.53.3",
    "protobuf>=6.31.1",
    "google-auth>=2.40.3",
    "sasy",
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.10",
    "clingo>=5.8.0",
    "z3-solver>=4.15.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
sasy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
